<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc"><title id="title">Memory：事实读取、历史检索与长期经验更新</title><desc id="desc">事实与模型经验存放在不同来源池。近期事实直接读，较早事实经融合排序回读原记录。长期经验按语义检索，生成器依据可用证据更新经验版本。</desc><defs><marker id="2b7895" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2b7895"/></marker><marker id="a6742e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a6742e"/></marker><marker id="38816e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#38816e"/></marker></defs><rect width="1440" height="1080" fill="#fff"/><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><path d="M350 195 H415" fill="none" stroke="#2b7895" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#2b7895)"/><path d="M350 390 H415" fill="none" stroke="#2b7895" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#2b7895)"/><path d="M1050 195 H1115" fill="none" stroke="#2b7895" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#2b7895)"/><path d="M1050 390 H1115" fill="none" stroke="#2b7895" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#2b7895)"/><path d="M350 640 H415" fill="none" stroke="#38816e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#38816e)"/><path d="M1050 640 H1115" fill="none" stroke="#38816e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#38816e)"/><path d="M450 895 H505" fill="none" stroke="#38816e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#38816e)"/><path d="M920 895 H975" fill="none" stroke="#38816e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#38816e)"/><path d="M1200 970 V990 H18 V640 H35" fill="none" stroke="#38816e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#38816e)"/><text x="40" y="48" font-size="32" font-weight="650" fill="#203e4c">Memory 与 Retrieval</text><text x="40" y="85" font-size="24" font-weight="400" fill="#5c737e">先限定身份、时间和权限，再选择内容；检索返回记录，决策模型据此行动</text><rect x="40" y="130" width="310" height="340" rx="9" fill="#f3f7f9" stroke="#d1dfe6" stroke-width="1.5"/><text x="62" y="170" font-size="26" font-weight="650" fill="#203e4c">完整事实来源</text><text x="62" y="208" font-size="23" font-weight="400" fill="#5c737e">初始化的真实历史</text><text x="62" y="242" font-size="23" font-weight="400" fill="#5c737e">＋ 已结算的仿真经历</text><text x="62" y="310" font-size="23" font-weight="400" fill="#5c737e">两种来源、两种时钟</text><text x="62" y="344" font-size="23" font-weight="400" fill="#5c737e">分别保留</text><rect x="420" y="130" width="630" height="120" rx="9" fill="#f3f7f9" stroke="#d1dfe6" stroke-width="1.5"/><text x="442" y="170" font-size="26" font-weight="650" fill="#203e4c">近期窗口：直接读取</text><text x="442" y="208" font-size="23" font-weight="400" fill="#5c737e">Customer 最近30次；Seller 每商品最近10点</text><rect x="420" y="310" width="630" height="160" rx="9" fill="#f3f7f9" stroke="#d1dfe6" stroke-width="1.5"/><text x="442" y="350" font-size="26" font-weight="650" fill="#203e4c">较早事实：筛选、排序、回读</text><text x="442" y="388" font-size="22" font-weight="400" fill="#5c737e">排除近期窗口；BGE＋实体关系，Seller另加经营数值</text><text x="442" y="422" font-size="22" font-weight="400" fill="#5c737e">融合名次后取最多5段，回读完整原始记录</text><rect x="1120" y="130" width="280" height="590" rx="9" fill="#f0f5f8" stroke="#d1dfe6" stroke-width="1.5"/><text x="1142" y="170" font-size="26" font-weight="650" fill="#203e4c">模型决策输入</text><text x="1142" y="208" font-size="22" font-weight="400" fill="#5c737e">Profile</text><text x="1142" y="276" font-size="22" font-weight="400" fill="#5c737e">近期事实</text><text x="1142" y="344" font-size="22" font-weight="400" fill="#5c737e">较早事实片段</text><text x="1142" y="412" font-size="22" font-weight="400" fill="#5c737e">相关长期经验</text><text x="1142" y="480" font-size="22" font-weight="400" fill="#5c737e">Response另加当前列表</text><rect x="40" y="560" width="310" height="160" rx="9" fill="#eef6f2" stroke="#d1dfe6" stroke-width="1.5"/><text x="62" y="600" font-size="26" font-weight="650" fill="#203e4c">独立长期经验库</text><text x="62" y="638" font-size="22" font-weight="400" fill="#5c737e">模型生成的总结／假设</text><text x="62" y="672" font-size="22" font-weight="400" fill="#5c737e">保留来源和版本</text><text x="62" y="706" font-size="22" font-weight="400" fill="#5c737e">仅取本Agent有效版本</text><rect x="420" y="560" width="630" height="160" rx="9" fill="#eef6f2" stroke="#d1dfe6" stroke-width="1.5"/><text x="442" y="600" font-size="26" font-weight="650" fill="#203e4c">长期经验：BGE语义检索</text><text x="442" y="638" font-size="22" font-weight="400" fill="#5c737e">按当前决策情境编码，余弦相似度排序</text><text x="442" y="672" font-size="22" font-weight="400" fill="#5c737e">最多5条；同分再看新近程度；无经验则返回空</text><text x="40" y="785" font-size="26" font-weight="650" fill="#203e4c">经验更新是另一条流程，不会把每次反馈直接改写成经验</text><rect x="40" y="820" width="410" height="150" rx="9" fill="#f3f7f9" stroke="#d1dfe6" stroke-width="1.5"/><text x="62" y="860" font-size="26" font-weight="650" fill="#203e4c">每10条未处理经历触发</text><text x="62" y="898" font-size="22" font-weight="400" fill="#5c737e">需先配置总结生成器</text><text x="62" y="932" font-size="22" font-weight="400" fill="#5c737e">从可用事实中选最多5条</text><rect x="510" y="820" width="410" height="150" rx="9" fill="#eef6f2" stroke="#d1dfe6" stroke-width="1.5"/><text x="532" y="860" font-size="26" font-weight="650" fill="#203e4c">生成候选经验</text><text x="532" y="898" font-size="22" font-weight="400" fill="#5c737e">选中事实＋相关旧经验</text><text x="532" y="932" font-size="22" font-weight="400" fill="#5c737e">可新增、修订、撤回或不更新</text><rect x="980" y="820" width="420" height="150" rx="9" fill="#eef6f2" stroke="#d1dfe6" stroke-width="1.5"/><text x="1002" y="860" font-size="26" font-weight="650" fill="#203e4c">检查与版本保存</text><text x="1002" y="898" font-size="22" font-weight="400" fill="#5c737e">校验格式、引用与已有质量规则</text><text x="1002" y="932" font-size="22" font-weight="400" fill="#5c737e">事实准确性仍需独立核对</text><text x="40" y="1048" font-size="22" font-weight="400" fill="#5c737e">BGE只生成检索向量；较长检索文本分块编码，完整历史保留。Qwen负责决策或候选总结。</text></g></svg>