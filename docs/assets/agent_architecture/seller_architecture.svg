<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc"><title id="title">Seller：经营信息、检索、定价与反馈</title><desc id="desc">本店概览和逐商品近期事实直接读取，较早同店事实与长期经验分别检索。市场分布由结构化统计查询取得。多个Customer反馈由环境汇总后供下一Tick使用。</desc><defs><marker id="2b7895" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2b7895"/></marker><marker id="a6742e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a6742e"/></marker><marker id="38816e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#38816e"/></marker></defs><rect width="1440" height="960" fill="#fff"/><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><path d="M202 345 V390" fill="none" stroke="#a6742e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a6742e)"/><path d="M547 345 V390" fill="none" stroke="#a6742e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a6742e)"/><path d="M892 345 V390" fill="none" stroke="#a6742e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a6742e)"/><path d="M1237 345 V390" fill="none" stroke="#a6742e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a6742e)"/><path d="M202 500 V555" fill="none" stroke="#a6742e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a6742e)"/><path d="M365 635 H380" fill="none" stroke="#a6742e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a6742e)"/><path d="M710 635 H725" fill="none" stroke="#a6742e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a6742e)"/><path d="M1055 635 H1070" fill="none" stroke="#a6742e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a6742e)"/><path d="M1237 710 V775" fill="none" stroke="#38816e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#38816e)"/><path d="M730 833 H18 V240 H35" fill="none" stroke="#38816e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#38816e)"/><text x="40" y="48" font-size="32" font-weight="650" fill="#203e4c">Seller Agent</text><text x="40" y="85" font-size="24" font-weight="400" fill="#5c737e">一家店一个 Agent；同时管理多个商品，读取此前已结算的经营信息</text><rect x="40" y="120" width="325" height="225" rx="9" fill="#f3f7f9" stroke="#d1dfe6" stroke-width="1.5"/><text x="62" y="160" font-size="26" font-weight="650" fill="#203e4c">直接读取本店事实</text><text x="62" y="198" font-size="22" font-weight="400" fill="#5c737e">全店简洁经营概览</text><text x="62" y="232" font-size="22" font-weight="400" fill="#5c737e">逐商品最近10个观测点</text><text x="62" y="266" font-size="22" font-weight="400" fill="#5c737e">价格、曝光、点击、购买</text><text x="62" y="300" font-size="22" font-weight="400" fill="#5c737e">仿真加入区间经营报告</text><rect x="385" y="120" width="325" height="225" rx="9" fill="#f3f7f9" stroke="#d1dfe6" stroke-width="1.5"/><text x="407" y="160" font-size="26" font-weight="650" fill="#203e4c">较早同店事实检索</text><text x="407" y="198" font-size="22" font-weight="400" fill="#5c737e">排除各商品近期窗口</text><text x="407" y="232" font-size="22" font-weight="400" fill="#5c737e">BGE＋商品关系＋数值</text><text x="407" y="266" font-size="22" font-weight="400" fill="#5c737e">最多5段，每段至多3点</text><text x="407" y="300" font-size="22" font-weight="400" fill="#5c737e">可来自同店其他商品</text><rect x="730" y="120" width="325" height="225" rx="9" fill="#fbf6eb" stroke="#d1dfe6" stroke-width="1.5"/><text x="752" y="160" font-size="26" font-weight="650" fill="#203e4c">同类市场统计</text><text x="752" y="198" font-size="22" font-weight="400" fill="#5c737e">同完整三级类目、异店</text><text x="752" y="232" font-size="22" font-weight="400" fill="#5c737e">按截止点和区间聚合</text><text x="752" y="266" font-size="22" font-weight="400" fill="#5c737e">参考价与经营分布</text><text x="752" y="300" font-size="22" font-weight="400" fill="#5c737e">结构化查询，不用BGE</text><rect x="1075" y="120" width="325" height="225" rx="9" fill="#eef6f2" stroke="#d1dfe6" stroke-width="1.5"/><text x="1097" y="160" font-size="26" font-weight="650" fill="#203e4c">长期经验检索</text><text x="1097" y="198" font-size="22" font-weight="400" fill="#5c737e">本店有效经验</text><text x="1097" y="232" font-size="22" font-weight="400" fill="#5c737e">BGE语义检索，最多5条</text><text x="1097" y="266" font-size="22" font-weight="400" fill="#5c737e">经营经验与推流假设</text><text x="1097" y="300" font-size="22" font-weight="400" fill="#5c737e">总结与原始事实分开</text><rect x="40" y="395" width="1360" height="105" rx="9" fill="#fbf6eb" stroke="#d1dfe6" stroke-width="1.5"/><text x="62" y="435" font-size="26" font-weight="650" fill="#203e4c">Seller 决策上下文</text><text x="62" y="473" font-size="23" font-weight="400" fill="#5c737e">本店事实 ＋ 较早历史 ＋ 市场参照 ＋ 相关长期经验；公开竞品明细可另行查询</text><rect x="40" y="560" width="325" height="150" rx="9" fill="#fbf6eb" stroke="#d1dfe6" stroke-width="1.5"/><text x="62" y="600" font-size="26" font-weight="650" fill="#203e4c">Seller 决策</text><text x="62" y="638" font-size="22" font-weight="400" fill="#5c737e">判断保持或调整价格</text><text x="62" y="672" font-size="22" font-weight="400" fill="#5c737e">可形成推流规则假设</text><rect x="385" y="560" width="325" height="150" rx="9" fill="#fbf6eb" stroke="#d1dfe6" stroke-width="1.5"/><text x="407" y="600" font-size="26" font-weight="650" fill="#203e4c">价格动作</text><text x="407" y="638" font-size="22" font-weight="400" fill="#5c737e">submit_prices / no_action</text><text x="407" y="672" font-size="22" font-weight="400" fill="#5c737e">大店分批提交草案</text><rect x="730" y="560" width="325" height="150" rx="9" fill="#f3f7f9" stroke="#d1dfe6" stroke-width="1.5"/><text x="752" y="600" font-size="26" font-weight="650" fill="#203e4c">环境应用价格</text><text x="752" y="638" font-size="22" font-weight="400" fill="#5c737e">所有Seller完成判断后</text><text x="752" y="672" font-size="22" font-weight="400" fill="#5c737e">统一更新当前生效价格</text><rect x="1075" y="560" width="325" height="150" rx="9" fill="#f3f7f9" stroke="#d1dfe6" stroke-width="1.5"/><text x="1097" y="600" font-size="26" font-weight="650" fill="#203e4c">平台与多个Customer</text><text x="1097" y="638" font-size="22" font-weight="400" fill="#5c737e">搜索并保存展示快照</text><text x="1097" y="672" font-size="22" font-weight="400" fill="#5c737e">产生点击与购买反馈</text><rect x="730" y="780" width="670" height="105" rx="9" fill="#eef6f2" stroke="#d1dfe6" stroke-width="1.5"/><text x="752" y="820" font-size="26" font-weight="650" fill="#203e4c">环境结算并汇总逐商品经营记录</text><text x="752" y="858" font-size="23" font-weight="400" fill="#5c737e">区间与累计统计写回本店事实库，供下一Tick读取</text><text x="45" y="780" font-size="22" font-weight="400" fill="#38816e">多个Customer的反馈先结算</text><text x="45" y="810" font-size="22" font-weight="400" fill="#38816e">再成为下一次决策的历史</text><text x="40" y="937" font-size="22" font-weight="400" fill="#5c737e">SFT：整店背景＋目标商品历史，监督一个真实价格观测点；仿真：保持或调整多商品价格。</text></g></svg>