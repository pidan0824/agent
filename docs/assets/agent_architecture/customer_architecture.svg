<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc"><title id="title">Customer：上下文、两阶段决策与反馈</title><desc id="desc">近期事实直接读取。较早事实和长期经验分别检索后进入两阶段决策。平台只把当前列表送入Response。结算后的经历写回事实库。</desc><defs><marker id="2b7895" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2b7895"/></marker><marker id="a6742e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a6742e"/></marker><marker id="38816e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#38816e"/></marker></defs><rect width="1440" height="960" fill="#fff"/><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><path d="M250 320 V370" fill="none" stroke="#2b7895" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#2b7895)"/><path d="M720 320 V370" fill="none" stroke="#2b7895" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#2b7895)"/><path d="M1190 320 V370" fill="none" stroke="#2b7895" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#2b7895)"/><path d="M240 480 V550" fill="none" stroke="#2b7895" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#2b7895)"/><path d="M1180 480 V550" fill="none" stroke="#2b7895" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#2b7895)"/><path d="M440 625 H515" fill="none" stroke="#2b7895" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#2b7895)"/><path d="M920 625 H995" fill="none" stroke="#2b7895" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#2b7895)"/><path d="M1200 705 V765" fill="none" stroke="#38816e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#38816e)"/><path d="M520 823 H18 V220 H35" fill="none" stroke="#38816e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#38816e)"/><text x="40" y="48" font-size="32" font-weight="650" fill="#203e4c">Customer Agent</text><text x="40" y="85" font-size="24" font-weight="400" fill="#5c737e">一名用户一个 Agent；先准备历史，再决定搜索与商品选择</text><rect x="40" y="120" width="420" height="200" rx="9" fill="#f3f7f9" stroke="#d1dfe6" stroke-width="1.5"/><text x="62" y="160" font-size="26" font-weight="650" fill="#203e4c">直接读取</text><text x="62" y="198" font-size="23" font-weight="400" fill="#5c737e">真实 Profile</text><text x="62" y="232" font-size="23" font-weight="400" fill="#5c737e">最近30次搜索、点击与购买</text><text x="62" y="266" font-size="23" font-weight="400" fill="#5c737e">跨购物主题保留，不按相关性删除</text><rect x="510" y="120" width="420" height="200" rx="9" fill="#f3f7f9" stroke="#d1dfe6" stroke-width="1.5"/><text x="532" y="160" font-size="26" font-weight="650" fill="#203e4c">较早事实检索</text><text x="532" y="198" font-size="23" font-weight="400" fill="#5c737e">本用户、截止前、排除近期30次</text><text x="532" y="232" font-size="23" font-weight="400" fill="#5c737e">BGE语义＋类目关系排序</text><text x="532" y="266" font-size="23" font-weight="400" fill="#5c737e">最多补充5段原始经历</text><rect x="980" y="120" width="420" height="200" rx="9" fill="#eef6f2" stroke="#d1dfe6" stroke-width="1.5"/><text x="1002" y="160" font-size="26" font-weight="650" fill="#203e4c">长期经验检索</text><text x="1002" y="198" font-size="23" font-weight="400" fill="#5c737e">仅本用户已有、有效的经验</text><text x="1002" y="232" font-size="23" font-weight="400" fill="#5c737e">BGE语义检索，最多5条</text><text x="1002" y="266" font-size="23" font-weight="400" fill="#5c737e">消费习惯与偏好；无经验则为空</text><rect x="40" y="375" width="1360" height="105" rx="9" fill="#f3f7f9" stroke="#d1dfe6" stroke-width="1.5"/><text x="62" y="415" font-size="26" font-weight="650" fill="#203e4c">本次决策上下文</text><text x="62" y="453" font-size="23" font-weight="400" fill="#5c737e">Profile ＋ 近期事实 ＋ 检索的较早事实 ＋ 相关长期经验；事实与总结分栏保存</text><rect x="40" y="555" width="400" height="150" rx="9" fill="#f3f7f9" stroke="#d1dfe6" stroke-width="1.5"/><text x="62" y="595" font-size="26" font-weight="650" fill="#203e4c">① Query 决策</text><text x="62" y="633" font-size="23" font-weight="400" fill="#5c737e">根据历史生成搜索词</text><text x="62" y="667" font-size="23" font-weight="400" fill="#5c737e">仿真也可等待或退出</text><rect x="520" y="555" width="400" height="150" rx="9" fill="#f3f7f9" stroke="#d1dfe6" stroke-width="1.5"/><text x="542" y="595" font-size="26" font-weight="650" fill="#203e4c">平台搜索与排序</text><text x="542" y="633" font-size="23" font-weight="400" fill="#5c737e">接收本次 Query</text><text x="542" y="667" font-size="23" font-weight="400" fill="#5c737e">返回当前商品列表</text><rect x="1000" y="555" width="400" height="150" rx="9" fill="#f3f7f9" stroke="#d1dfe6" stroke-width="1.5"/><text x="1022" y="595" font-size="26" font-weight="650" fill="#203e4c">② Response 决策</text><text x="1022" y="633" font-size="23" font-weight="400" fill="#5c737e">上下文＋本次 Query＋当前列表</text><text x="1022" y="667" font-size="23" font-weight="400" fill="#5c737e">输出点击集合与购买集合</text><text x="450" y="601" font-size="19" font-weight="400" fill="#2b7895">Query</text><text x="932" y="601" font-size="19" font-weight="400" fill="#2b7895">列表</text><rect x="520" y="770" width="880" height="105" rx="9" fill="#eef6f2" stroke="#d1dfe6" stroke-width="1.5"/><text x="542" y="810" font-size="26" font-weight="650" fill="#203e4c">环境结算并写入本用户事实库</text><text x="542" y="848" font-size="23" font-weight="400" fill="#5c737e">记录搜索、点击与购买；下一次决策重新读取和检索</text><text x="45" y="780" font-size="22" font-weight="400" fill="#38816e">结算后的新经历</text><text x="45" y="810" font-size="22" font-weight="400" fill="#38816e">进入后续历史</text><text x="40" y="928" font-size="22" font-weight="400" fill="#5c737e">SFT：Query与Response分别用真实标签监督；本次离线复测的Response使用真实Query。</text></g></svg>