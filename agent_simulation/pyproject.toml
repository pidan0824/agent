[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-agent-simulation"
version = "0.1.0"
description = "Customer and Seller agents for an e-commerce policy sandbox"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "lm-format-enforcer @ https://codeload.github.com/noamgat/lm-format-enforcer/tar.gz/2597936f55da0e3cab8a6047eba91b2ecdfe888a",
    "transformers==5.3.0",
    "torch",
    "pydantic-ai-slim==1.107.9",
    "httpx>=0.27,<1",
    "jsonschema>=4.20,<5",
    "duckdb==1.4.3",
]

[project.optional-dependencies]
training = ["peft==0.18.1", "accelerate==1.10.1"]
dev = ["black==24.10.0", "ruff==0.14.3"]

[tool.setuptools.packages.find]
where = [".."]
include = ["agent_simulation*"]
namespaces = false

[tool.setuptools.package-data]
agent_simulation = [
    "datasets/*.json",
    "inference/*.json",
    "platform/*.json",
    "simulation/templates/*.html",
]

[tool.black]
line-length = 100
target-version = ['py312']
